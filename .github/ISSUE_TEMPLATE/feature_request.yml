name: Feature idea
description: Suggest something difftop could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see, and why?
      description: The situation matters more than the solution. What were you doing when you wished difftop did this?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it look or work?
