# Builds difftop for every supported platform. Pushing a tag like `v0.2.0`
# publishes the binaries as a GitHub release; running it by hand from the
# Actions tab only builds them, which is a safe way to test this file.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl makes the Linux binaries static, so they run on any distro.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, asset: difftop-linux-x86_64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, asset: difftop-linux-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # The release asset is the bare binary, so downloading it is all there is to it.
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/difftop ${{ matrix.asset }}
          sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes difftop-*
        env:
          GH_TOKEN: ${{ github.token }}
