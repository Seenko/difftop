# Builds difftop for every supported platform. Pushing a tag like `v0.2.0`
# publishes the binaries as a GitHub release; running it by hand from the
# Actions tab only builds them, which is a safe way to test this file.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl makes the Linux binaries static, so they run on any distro.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=difftop-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/difftop README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: difftop-*.tar.gz*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes difftop-*
        env:
          GH_TOKEN: ${{ github.token }}
